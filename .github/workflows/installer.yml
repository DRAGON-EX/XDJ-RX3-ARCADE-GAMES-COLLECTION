name: Build USB installers
on:
  push:
    paths: ['installer/**', 'tools/build_installer.py', 'tests/test_installer.py', '.github/workflows/installer.yml', 'VERSION']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Update the Windows and Linux installer downloads in release v0.4.7
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  installer:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r installer/requirements-build.txt
      - run: python -m unittest discover -s tests -p test_installer.py -v
      - run: python tools/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: DJ-DRAGON-X-Cat-Rescue-Saga-Installer-${{ runner.os }}-0.4.7
          path: dist/installer/*.zip
          retention-days: 90
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: installer
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DJ-DRAGON-X-Cat-Rescue-Saga-Installer-*-0.4.7
          merge-multiple: true
          path: installers
      - name: Update release installer downloads
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: installers
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          gh release upload v0.4.7 *.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release view v0.4.7 --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md
          python - <<'PY'
          from pathlib import Path
          p = Path('release-notes.md')
          p.write_text(p.read_text().replace('XDJ-RX3-GAMES-COLLECTION', 'XDJ-RX3-ARCADE-GAMES-COLLECTION').replace('/blob/v0.4.7/', '/blob/main/'))
          PY
          gh release edit v0.4.7 --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
